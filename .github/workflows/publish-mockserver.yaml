name: Publish rhcl/mockserver

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/publish-mockserver.yaml"
      - "rhcl/mockserver/**"

env:
  REGISTRY: quay.io
  IMAGE: quay.io/pbastide_rh/mockserver-ppc64le
  MANIFEST: mockserver-multiarch

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Log into Quay
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HTTPBIN_USER }}
          password: ${{ secrets.HTTPBIN_TOKEN }}

      - name: Build multi-architecture image
        shell: bash
        run: |
          set -euo pipefail

          buildah manifest create "${MANIFEST}"

          buildah bud \
            --platform linux/ppc64le \
            --manifest "${MANIFEST}" \
            --format oci \
            --layers=false \
            --tls-verify=true \
            -f rhcl/mockserver/Containerfile \
            rhcl/mockserver

          buildah bud \
            --platform linux/s390x \
            --manifest "${MANIFEST}" \
            --format oci \
            --layers=false \
            --tls-verify=true \
            -f rhcl/mockserver/Containerfile \
            rhcl/mockserver

      - name: Inspect manifest
        run: buildah manifest inspect "${MANIFEST}"

      - name: Push latest tag
        run: |
          buildah manifest push --all \
            "${MANIFEST}" \
            "docker://${IMAGE}:latest"

      - name: Push commit tag
        run: |
          buildah manifest push --all \
            "${MANIFEST}" \
            "docker://${IMAGE}:${GITHUB_SHA}"